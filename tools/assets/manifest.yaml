  - { id: mine/bg_1, style: dark, size: [1920, 1088], out: [1920, 1080], prompt: "Side view cross-section of a 12th century mine tunnel, like a slice through the mountain in a picture book: a low horizontal tunnel runs straight across the whole image from the left edge to the right edge, rough grey rock walls, heavy wooden support beams, scattered stones on the floor, solid rock above and below the tunnel. Flat, even, dim light everywhere, bare walls, no people." }
  - { id: mine/bg_2, style: dark, size: [1920, 1088], out: [1920, 1080], prompt: "Side view cross-section of a 19th century mine gallery, like a slice through the mountain in a picture book: a horizontal gallery runs across the whole image from the left edge to the right edge, rock walls with timber supports, iron rails on the floor, a wooden ladder leaning on the wall, solid rock above and below. Flat, even, dim light everywhere, bare walls, no people." }
