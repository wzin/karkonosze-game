style:
  dusk: "Illustrated as a layered paper-cut storybook scene with soft gouache texture, muted dusk palette of slate blue, moss green, ochre and plum, gentle rounded shapes, clean silhouettes, no text, no letters, no watermark."
  dark: "Illustrated as a layered paper-cut storybook scene with soft gouache texture, deep umber and slate palette with warm ochre accents, gentle rounded shapes, clean silhouettes, no text, no letters."
  morning: "Illustrated as a layered paper-cut storybook scene with soft gouache texture, fresh morning palette of pale gold, sage green and sky blue, gentle rounded shapes, clean silhouettes, no text, no letters."
  # Iteration 1 (owner feedback): less childish, more serious and mysterious; used by the regenerated hub,
  # turnips/bg and herbs sets. The original three stay for the assets painted with them.
  mist_dusk: "Painted as a serious, atmospheric illustration for a book of old mountain legends, not a cartoon and not childish: matte gouache with a fine paper grain with subtle layered paper-cut depth between the planes, fine painterly detail, deep misty dusk, low-saturation muted palette of slate blue, moss green, dusky plum and dim ochre, soft diffused light, haze and mist between the layers, quiet and mysterious mood, no text, no letters, no watermark."
  mist_morning: "Painted as a serious, atmospheric illustration for a book of old mountain legends, not a cartoon and not childish: matte gouache with a fine paper grain with subtle layered paper-cut depth between the planes, fine painterly detail, cool misty early morning, low-saturation muted palette of grey-green moss, slate blue, pale ochre and cold silver light, soft diffused light, haze and mist between the layers, quiet and serious mood, no text, no letters, no watermark."
# Same look without "layered ... scene": for single cut-out subjects (kind: object, default for cutout: true).
style_object:
  dusk: "Paper-cut storybook illustration with soft gouache texture, muted dusk palette of slate blue, moss green, ochre and plum, gentle rounded shapes, clean silhouette, no text, no letters, no watermark."
  dark: "Paper-cut storybook illustration with soft gouache texture, deep umber and slate palette with warm ochre accents, gentle rounded shapes, clean silhouette, no text, no letters."
  morning: "Paper-cut storybook illustration with soft gouache texture, fresh morning palette of pale gold, sage green and sky blue, gentle rounded shapes, clean silhouette, no text, no letters."
  mist_dusk: "Painted as a serious, atmospheric illustration for a book of old mountain legends, not a cartoon and not childish: matte gouache with a fine paper grain, fine painterly detail, low-saturation muted palette of deep indigo, slate blue, dusky plum and dim ochre, soft diffused light, quiet and mysterious mood, no text, no letters, no watermark."
  mist_morning: "Painted as a serious, atmospheric illustration for a book of old mountain legends, not a cartoon and not childish: matte gouache with a fine paper grain with a clean paper-cut silhouette, fine painterly detail, natural proportions, low-saturation muted palette of moss green, slate, dark umber and dim ochre, soft diffused light, no text, no letters, no watermark."
  # kind: wisp (mist sprites): soft brushwork only, a paper-cut edge would show as a hard ribbon.
  wisp: "Soft, diffuse and airy like real fog or smoke, translucent with smooth gradual gradients, no visible brush strokes, no bristle marks, no hard edges, pale cool grey-white, no text, no letters, no watermark."
cutout_suffix: " Single subject centered on a plain flat light grey background, whole object fully visible, no cast shadow, no ground."
# kind: band = landscape strip; cutout.py keys out the flat sky (birefnet sees no object in a landscape).
band_suffix: " The land spans the full width of the image and touches the left, right and bottom edges; above it is an empty, plain, flat light grey sky with nothing in it."
# kind: wisp = light mist on flat black; cutout.py derives the alpha from luminance.
wisp_suffix: " Only the mist, on a plain flat solid pure black background, nothing else in the picture: no land, no trees, no moon, no stars, no horizon."
# route: edit gets no style sentence (it makes the edit model repaint the colours).
edit_suffix: " Keep exactly the same character design, face, clothing colors, proportions, art style, scale and framing, and the same plain light background, no cast shadow."
# route: edit for a full-frame scene (a background repainted from a sibling, e.g. mine/bg_3 from mine/bg_2).
edit_suffix_scene: " Keep exactly the same painted storybook style, brushwork, rock texture, palette, framing and side cross-section view as the reference picture; no text, no letters."
assets:
  - { id: hub/sky, style: mist_dusk, size: [1920, 1088], out: [1920, 1080], kind: object, route: nano, prompt: "A dramatic dusk sky filling the entire picture from the top edge to the bottom edge, nothing but sky: deep indigo at the top fading through violet and dusky plum to a faint pale afterlight just above the bottom edge, dense layered low clouds in the lower half softly lit from below, thinner veils of cloud higher up, a small pale moon in the upper right. There is no horizon line and no ground: no land, no mountains, no hills, no trees and no dark silhouettes along the bottom; the bottom edge is cloud and pale light." }
  - { id: hub/ridge_far, style: mist_dusk, size: [2048, 816], out: [2560, 1024], cutout: true, kind: band, route: nano, peel_rim: light, prompt: "A wide panorama of the whole main ridge of the Giant Mountains (Karkonosze) seen from far away to the north: a high, massive mountain wall stretching across the entire width of the picture. From left to right: near the left edge the highest summit, a tall, steep, bare cone of grey rock scree, with a tiny round baroque stone chapel with a small turret and two small saucer-shaped observatory towers on its pointed top; right of it the ridge drops into a steep glacial cirque with a dark rock wall; then a long, high, almost level plateau whose north face is cut by two more glacial cirques with dark rock walls; then a broad, rounded dome summit; then two deep glacial cirques side by side with steep rock walls, with a tall slender transmitter tower standing on their upper rim; then another rounded summit; and at the far right end a rounded summit with a small mountain hut on top. Bare rocky tops and dwarf pine above the tree line, dark spruce forest on the lower slopes dissolving into mist at the foot. Deep dusk light: the whole range lies in cool blue-violet shadow, softened by atmospheric haze as seen from many kilometres away, low contrast, simplified distant detail. The painting fills the whole picture edge to edge with no border or frame. No labels, no text." }
  - { id: hub/ridge_mid, style: mist_dusk, size: [1920, 640], cutout: true, kind: band, route: nano, prompt: "A band of rounded, forested foothills seen from the side like a flat theatre backdrop at misty dusk, dark spruce and beech forest, thin mist lying in the hollows between the hills. Right of center, on a steep wooded hill crowned by a granite rock outcrop, stands a medieval castle ruin with broken stone walls and one tall roofless round keep tower. Left of center, on a lower rounded wooded hill, stands a small ruined stone watchtower. No mountains behind the hills." }
  - { id: hub/valley, style: mist_dusk, size: [1920, 560], cutout: true, kind: band, route: nano, prompt: "Foreground of a wide valley at misty dusk seen from a low hill: dark meadows and fields, a slow winding river, a small old town of slate and muted red roofs with a tall church tower in the center, a few windows lit faintly in dim ochre, dark orchards and hedgerows, low fog pooling along the river and between the houses. The valley forms one horizontal band whose far edge is a soft, irregular line of dark tree crowns and hedgerows, with no hills or mountains behind it. The land fills the picture edge to edge with no border, no frame and no paper margin; the sky above it is completely empty and flat, with no clouds and no fog." }
  - { id: hub/mist_1, style: wisp, size: [2048, 512], cutout: true, kind: wisp, route: nano, fade_x: true, prompt: "One long, thin, soft horizontal veil of drifting mountain mist, about six times wider than tall, stretching across the whole width of the picture through the middle: a few overlapping translucent streaks, denser in the middle, thinning out towards both ends like smoke." }
  - { id: hub/mist_2, style: wisp, size: [1536, 384], cutout: true, kind: wisp, route: nano, fade_x: true, prompt: "A soft, low horizontal bank of valley fog, about four times wider than tall, lying across the middle of the picture: two or three overlapping translucent drifting layers with soft, diffuse, slightly ragged upper edges, thinning out towards both ends like smoke." }
