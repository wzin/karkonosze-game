  - { id: herbs/bg_far, style: mist_morning, size: [1920, 1088], out: [1920, 1080], route: nano, prompt: "Cool misty early morning view up a forested mountain slope toward a distant conical summit with a tiny chapel on top, half hidden in mist; several receding planes of dark spruce forest separated by bands of pale mist; the foreground is a plain, quiet high meadow of grass and moss without any path, no people." }
  - { id: herbs/strip_mid, style: mist_morning, size: [2048, 640], cutout: true, kind: band, route: nano, key_pockets: false, prompt: "A long horizontal band of misty spruce forest edge seen exactly from the side like a flat theatre backdrop: a row of tall dark spruces of different heights whose pointed tops stand fully visible, large mossy granite boulders and ferns at their foot, cool morning mist between the trunks, no perspective, no view deep into the forest, no distant mountains. The land fills the picture edge to edge with no border, no frame and no paper margin; the sky above it is completely empty and flat, with no clouds and no fog." }
