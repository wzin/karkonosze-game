  - { id: turnips/bg, style: mist_dusk, size: [1920, 1088], out: [1920, 1080], route: nano, prompt: "A view up to the summit of Snezka, the highest mountain of the Giant Mountains, at misty dusk. In the upper left third of the picture rises a steep conical summit covered entirely with grey granite boulder scree, bare rock with no grass on it; on its top stand a small round baroque stone chapel with a domed roof and a small turret, and beside it an observatory of two stacked flat saucer-shaped discs. A stone path zigzags down the scree slope. Below the summit lies a high mountain meadow of dark tussock grass and low dwarf pines, with mist drifting across the slope; dramatic heavy clouds in the sky. The whole lower forty percent of the picture is a vegetable field in the foreground: dark, freshly turned soil in long parallel furrows running across the image from left to right, empty, no plants, no people." }
